<!doctype html>
<html><head>
<meta charset="utf-8"><title>LapSync</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head><body>
<div class="card">
  <h2>LapSync - Upload</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat,msg in messages %}
        <div class="alert {{cat}}">{{msg}}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post" enctype="multipart/form-data">
    <label>Your name</label><input name="name">
    <label>Contact</label><input name="contact">
    <label>Upload media (image/video)</label><input type="file" name="media" accept="image/,video/" required>
    <label>Upload audio files (multiple allowed)</label><input type="file" name="audios" multiple accept="audio/*">
    <button class="btn">Upload LapSync Job</button>
  </form>
  <a class="muted" href="{{ url_for('index') }}">← Home</a>
</div>
</body></html>
