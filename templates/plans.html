<!doctype html>
<html><head>
<meta charset="utf-8"><title>Plans — TalkClone</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head><body>
<div class="card center">
  <h2>Subscription Plans</h2>
  <div class="plans-grid">
    {% for p in plans %}
      <div class="plan">
        <h3>{{ p.title }}</h3>
        <p>{{ p.voices }}</p>
        <p class="price">Rs {{ p.price }}</p>
        <form method="post" action="{{ url_for('talkclone') }}">
          <input type="hidden" name="plan" value="{{ p.id }}">
          <button class="btn">Buy</button>
        </form>
      </div>
    {% endfor %}
  </div>
  <a class="muted" href="{{ url_for('index') }}">← Back</a>
</div>
</body></html>
