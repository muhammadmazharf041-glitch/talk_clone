<!doctype html>
<html><head>
<meta charset="utf-8"><title>Talk Clone</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head><body>
<div class="card">
  <h2>Talk Clone</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="messages">
      {% for cat,msg in messages %}
        <div class="alert {{ cat }}">{{ msg }}</div>
      {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post" enctype="multipart/form-data">
    <label>Your name</label>
    <input name="user_name" required>
    <label>Contact (phone/email)</label>
    <input name="contact" required>
    <label>Choose plan</label>
    <select name="plan">
      <option value="monthly">Monthly - 5000</option>
      <option value="3month">3 months - 18000</option>
      <option value="yearly">Yearly - 50000</option>
    </select>
    <label>Amount (PKR)</label>
    <input name="amount" value="5000">
    <label>Upload proof (image)</label>
    <input type="file" name="proof" accept="image/*" required>
    <button class="btn" type="submit">Send Proof & Request Token</button>
  </form>

  <hr>
  <h3>Already have token? Generate voice</h3>
  <form action="{{ url_for('generate') }}" method="post" enctype="multipart/form-data">
    <label>Token</label><input name="token" placeholder="Your token">
    <label>Device ID (unique)</label><input name="device_id" placeholder="device123">
    <label>Sample voice (optional .wav)</label><input type="file" name="speaker" accept=".wav,.mp3">
    <label>Text to speak</label><textarea name="text" rows="4" placeholder="Type text to speak"></textarea>
    <label>Language</label><input name="language" value="en">
    <button class="btn">Generate</button>
  </form>

  <a class="muted" href="{{ url_for('index') }}">← Home</a>
</div>
</body></html>
